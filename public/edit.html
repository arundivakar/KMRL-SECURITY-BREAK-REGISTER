<!DOCTYPE html>
<html>
<head>
    <title>Edit Break Entry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="admin.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div class="dashboard">
        
        <!-- ===== TOP ===== -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; flex-wrap:wrap; gap:15px;">
            <div>
                <h2 style="margin:0;">Edit Break Entry</h2>
                <p style="margin-top:8px; color:#64748b; font-size:15px;">Modify employee break details safely</p>
            </div>
            <a href="/dashboard" style="text-decoration:none;">
                <button class="admin-btn">← Back to Dashboard</button>
            </a>
        </div>

        <!-- ===== SUMMARY ===== -->
        <div class="edit-summary-box">
            <div>
                <div class="summary-label">DATE</div>
                <div class="summary-value"><span id="date"></span></div>
            </div>
            <div>
                <div class="summary-label">SECURITY NAME</div>
                <div class="summary-value highlight"><span id="security-name"></span></div>
            </div>
        </div>

        <!-- ===== FORM ===== -->
        <div class="edit-card">
            
            <!-- ===== ERROR ALERT ===== -->
            <div id="error-alert" style="display:none; background:#fee2e2; border:1px solid #f87171; color:#b91c1c; padding:14px 18px; border-radius:8px; font-weight:600; margin-bottom:25px; font-size:14px; line-height:1.4;"></div>

            <!-- ===== EMPLOYEE ===== -->
            <h3>Employee Details</h3>
            <div class="form-grid">
                <div>
                    <label>Employee ID <span style="color:#ef4444;">*</span></label>
                    <input type="text" id="emp_id" placeholder="Enter ID">
                    <div id="emp_status" style="font-size:12px; margin-top:5px; font-weight:600;"></div>
                </div>
                <div>
                    <label>Station <span style="color:#ef4444;">*</span></label>
                    <select id="station">
                        <option value="">Select Station</option>
                        <option value="ALVA">ALVA</option>
                        <option value="PNCU">PNCU</option>
                        <option value="CPPY">CPPY</option>
                        <option value="AATK">AATK</option>
                        <option value="MUTT">MUTT</option>
                        <option value="KLMT">KLMT</option>
                        <option value="CCUV">CCUV</option>
                        <option value="PDPM">PDPM</option>
                        <option value="EDAP">EDAP</option>
                        <option value="CGPP">CGPP</option>
                        <option value="PARV">PARV</option>
                        <option value="JLSD">JLSD</option>
                        <option value="KALR">KALR</option>
                        <option value="TNHL">TNHL</option>
                        <option value="MGRD">MGRD</option>
                        <option value="MACE">MACE</option>
                        <option value="ERSH">ERSH</option>
                        <option value="KVTR">KVTR</option>
                        <option value="EMKM">EMKM</option>
                        <option value="VYTA">VYTA</option>
                        <option value="TKDM">TKDM</option>
                        <option value="PETT">PETT</option>
                        <option value="VAKK">VAKK</option>
                        <option value="SNJN">SNJN</option>
                        <option value="TPHT">TPHT</option>
                    </select>
                </div>
                <div>
                    <label>Shift Type</label>
                    <select id="shift_type">
                        <option value="NORMAL">NORMAL</option>
                        <option value="DOUBLE">DOUBLE</option>
                    </select>
                </div>
            </div>

            <!-- ===== BREAKS ===== -->
            <h3 style="margin-top:40px;">Break Details (Minutes)</h3>
            <div id="running-break-notice" style="display:none; margin-bottom:15px; padding:10px 14px; background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; border-radius:8px; font-size:13px; font-weight:500;"></div>
            <div class="form-grid-small">
                <div>
                    <label>Break 1</label>
                    <input type="number" id="break1" placeholder="0">
                </div>
                <div>
                    <label>Break 2</label>
                    <input type="number" id="break2" placeholder="0">
                </div>
                <div>
                    <label>Break 3</label>
                    <input type="number" id="break3" placeholder="0">
                </div>
                <div>
                    <label>Break 4</label>
                    <input type="number" id="break4" placeholder="0">
                </div>
                <div>
                    <label>Break 5</label>
                    <input type="number" id="break5" placeholder="0">
                </div>
                <div>
                    <label>Break 6</label>
                    <input type="number" id="break6" placeholder="0">
                </div>
            </div>

            <!-- ===== AUDIT ===== -->
            <h3 style="margin-top:40px;">Edit Audit Information</h3>
            <div class="form-grid">
                <div>
                    <label>Edited By Name <span style="color:#ef4444;">*</span></label>
                    <input type="text" id="edited_by_name" placeholder="Your Name">
                </div>
                <div>
                    <label>Edited By Employee ID <span style="color:#ef4444;">*</span></label>
                    <input type="text" id="edited_by_emp" placeholder="Your ID">
                </div>
            </div>

            <label>Edit Reason <span style="color:#ef4444;">*</span></label>
            <textarea id="edit_reason" placeholder="Provide a detailed reason for modifying these records..." style="min-height:120px; resize:vertical;"></textarea>

            <!-- ===== BUTTONS ===== -->
            <div style="display:flex; gap:15px; margin-top:35px; flex-wrap:wrap;">
                <button onclick="saveEdit()" style="flex:1; min-width:220px;">Save Changes</button>
                <a href="/dashboard" style="flex:1; min-width:220px; text-decoration:none;">
                    <button type="button" class="admin-btn" style="width:100%;">Cancel</button>
                </a>
            </div>

        </div>

        <!-- ===== HISTORY ===== -->
        <div class="edit-card">
            <h3 style="margin-top:0;">Edit History</h3>
            <div style="padding:15px 0; color:#94a3b8; font-size:14px; font-weight:500;">
                Edit history tracking not enabled yet.
            </div>
        </div>

    </div>
    <script src="edit.js"></script>
</body>
</html>
