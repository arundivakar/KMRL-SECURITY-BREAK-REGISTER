<!DOCTYPE html>
<html>

<head>
    <title>Add Security Guard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>
    <div class="container" style="max-width: 500px;">
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div>
                <h2 style="margin:0;">Add Security Guard</h2>
                <div style="font-size:14px; color:#6b7280; margin-top:5px;">Master List Update</div>
            </div>
            <a href="/dashboard" style="text-decoration:none;">
                <button style="padding: 8px 12px; font-size: 14px; background: #e2e8f0; color: #1f2937;">Back</button>
            </a>
        </div>

        <div style="background:#fef2f2; border:1px solid #f87171; color:#b91c1c; padding:12px 16px; border-radius:8px; margin-bottom:20px; font-weight:600; text-align:center;">
            ?? STRICTLY FOR MUTT SC USE ONLY
        </div>

        <form id="addGuardForm" style="display:flex; flex-direction:column; gap:15px;">
            <div>
                <label style="display:block; font-size:14px; font-weight:600; color:#374151; margin-bottom:5px;">Employee ID (e.g. TCSEK1234)</label>
                <input type="text" id="guard_emp_id" placeholder="Enter Employee Number" required style="width:100%; box-sizing:border-box;">
            </div>

            <div>
                <label style="display:block; font-size:14px; font-weight:600; color:#374151; margin-bottom:5px;">Full Name</label>
                <input type="text" id="guard_name" placeholder="Enter Full Name" required style="width:100%; box-sizing:border-box;">
            </div>

            <div>
                <label style="display:block; font-size:14px; font-weight:600; color:#374151; margin-bottom:5px;">Designation (Optional)</label>
                <input type="text" id="guard_designation" placeholder="e.g. Security Guard" style="width:100%; box-sizing:border-box;">
            </div>

            <button type="submit" id="submitBtn" style="margin-top:10px; width:100%;">Add to Master List</button>
        </form>

    </div>

    <!-- ===== NOTIFICATION ===== -->
    <div id="notification" style="
        position:fixed;
        bottom:20px;
        left:50%;
        transform:translateX(-50%);
        background:#1f2937;
        color:white;
        padding:12px 24px;
        border-radius:30px;
        font-weight:600;
        font-size:14px;
        box-shadow:0 10px 15px -3px rgba(0,0,0,0.2);
        opacity:0;
        visibility:hidden;
        transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index:9999;
        display:flex;
        align-items:center;
        gap:8px;
    ">
        <span id="notif-icon">?</span>
        <span id="notif-text">Success</span>
    </div>

    <script src="add_guard.js"></script>
</body>
</html>
